name: litegauge
display_name: 轻仪 LiteGauge
family: litegauge
form: mac
lifecycle: active
bundle_id: cyou.tianli.litegauge
origin: own
description: 极简菜单栏 CPU、内存、启动磁盘监控，原生 AppKit，共享采集 CLI。
surfaces:
  - type: vhost
    id: litegauge.tianli.cyou
    host: vps
    note: 公开静态产品主页；root=/var/www/litegauge
key_scripts:
  - build.sh
  - scripts/install.sh
sop:
  promo: true
  promo_url: https://litegauge.tianli.cyou/
  media:
    - docs/media/
  media_meta: docs/media/manifest.json
  capture: bash scripts/capture-media.sh
  release: release/latest.json
  site_build: python3 scripts/build-site.py
  site_deploy: bash scripts/deploy-site.sh
  test: bash build.sh --test-only
  ui:
    - Sources/App.swift
  source:
    - Sources/**
    - Tests/**
    - Info.plist
    - icon/AppIcon.icns
    - build.sh
  test_inputs:
    - Tests/**
  measure:
    app: /Applications/LiteGauge.app
    launch: false
  budget:
    cpu: 0.3
    memory_mb: 30
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/LiteGauge
    rationale: 56 点菜单栏，随时查看 CPU、内存与磁盘。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
