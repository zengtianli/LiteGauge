name: litegauge
name_en: LiteGauge
name_zh: 轻仪
display_name: LiteGauge · 轻仪
family: litegauge
form: mac
lifecycle: active
bundle_id: cyou.tianli.litegauge
origin: own
description: 极简菜单栏 CPU、内存、启动磁盘监控，具体资源建议与已允许后台应用自动处理；原生 AppKit，共享 CLI。
surfaces:
- type: vhost
  id: litegauge.tianli.cyou
  host: vps
  note: 公开静态产品主页；root=/var/www/litegauge
key_scripts:
- build.sh
- scripts/install.sh
sop:
  platforms:
    mac: {}
    iphone:
      not_applicable: 当前监控器读取 Mac 主机 Mach CPU、内存统计和启动磁盘容量；iOS 不开放同口径全机监控与 macOS 菜单栏接口。
    ipad:
      not_applicable: 当前监控器读取 Mac 主机 Mach CPU、内存统计和启动磁盘容量；iPadOS 不开放同口径全机监控与 macOS 菜单栏接口。
    watch:
      not_applicable: watchOS 不开放 Mac 主机全机 CPU、内存和启动磁盘统计，也没有 macOS 菜单栏。
    vision:
      not_applicable: visionOS 不开放 Mac 主机同口径的全机 CPU、内存和启动磁盘统计，也没有 macOS 菜单栏。
  accept:
    functionality: bash scripts/accept/functionality.sh
    recovery: bash scripts/accept/recovery.sh
    privacy: bash scripts/accept/privacy.sh
    native_ui: bash scripts/accept/native_ui.sh
  promo: true
  promo_url: https://litegauge.tianli.cyou/
  media:
  - docs/media/
  media_meta: docs/media/manifest.json
  capture: bash scripts/capture-media.sh
  release: release/latest.json
  site_build: python3 scripts/build-site.py
  site_deploy: bash scripts/deploy-site.sh
  test: bash build.sh --test-only
  cli:
    app: cyou.tianli.litegauge
    commands:
    - litegauge
  # 界面功能对照：从 Sources/App.swift（菜单栏与菜单）、DiagnosticsUI.swift（诊断窗口）、SettingsUI.swift 与
  # AppLifecycleUI.swift（设置窗口）逐项列出。human 的名字与 Sources/CLI.swift 的 windowOnly 一致，核心测试核对。
  # 设置窗口「配置」「软件更新」两组的命令来自共享命令层（Sources/AppLifecycleCLI.swift，接线在 ProductLifecycle.swift）。
  agent_cli:
    readback: litegauge care status
    features:
    # 菜单栏与菜单
    - name: 菜单栏指示图标（CPU 百分比、内存与磁盘填充条）
      command: litegauge status
    - name: 详情面板（CPU、内存已用与总量、压力、交换、启动磁盘剩余与总容量、读取错误）
      command: litegauge status
    - name: 读数每 2 秒自动更新
      command: litegauge watch
    - name: 立即刷新（⌘R）
      command: litegauge status
    - name: 资源建议与自动处理…
      human: 只是打开诊断窗口；窗口里的读数、建议与处理各有命令（diagnose、care plan、care run）
    - name: 菜单勾选「内存超预算时自动处理」
      command: litegauge care budget
    - name: 菜单状态行（自动处理现状、是否正在处理、最近一次结果）
      command: litegauge care status
    - name: 打开活动监视器…
      human: 打开系统自带的活动监视器窗口，只在屏幕上有意义；进程占用用 diagnose 读
    - name: 设置…
      human: 只是打开设置窗口（菜单 ⌘, 与诊断窗口里的按钮）；窗口里的项各有命令（care status、care budget、care protect、care enable、config、update check），暂缺的两项另列
    - name: 检查更新…（菜单与设置窗口）
      command: litegauge update check
    - name: 退出轻仪（⌘Q）
      command: litegauge app quit
    - name: 菜单栏实例是否在运行、已装版本
      command: litegauge app status
    # 诊断窗口
    - name: 诊断窗口：系统内存一行（已用、压力、压缩、交换）
      command: litegauge status
    - name: 诊断窗口：内存超预算时自动处理开关
      command: litegauge care budget
    - name: 诊断窗口：自动处理现状说明（预算、超过后做什么）
      command: litegauge care budget
    - name: 诊断窗口：按建议处理（含关闭数量确认）
      command: litegauge care run
    - name: 诊断窗口：处理进度与结果、历史处理
      command: litegauge care status
    - name: 诊断窗口：建议（将关闭的应用、受保护的应用、占用构成）
      command: litegauge care plan
    - name: 诊断窗口：按内存 / 按 CPU 排序
      command: litegauge diagnose
    - name: 诊断窗口：刷新诊断（⌘R）
      command: litegauge diagnose
    - name: 诊断窗口：应用与后台进程列表（内存、CPU、进程数）
      command: litegauge diagnose
    - name: 诊断窗口：选中一行查看其中的进程（PID、内存、CPU）
      command: litegauge diagnose
    - name: 诊断窗口：采样状态行（时间、进程数、身份不可读数、用时）
      command: litegauge diagnose
    # 设置窗口
    - name: 设置：名称与当前版本
      command: litegauge app status
    - name: 设置：内存超过预算时自动处理开关
      command: litegauge care budget
    - name: 设置：内存预算（GiB）与本机内存、当前已用
      command: litegauge care budget
    - name: 设置：自动关闭闲置应用开关
      command: litegauge care budget
    - name: 设置：闲置多久后可以关闭
      command: litegauge care budget
    - name: 设置：异常恢复开关
      command: litegauge care enable
    - name: 设置：始终保留的应用（保护名单）
      command: litegauge care protect
    - name: 设置：使用 iCloud 记住配置
      command: litegauge config sync
    - name: 设置：导出配置…
      command: litegauge config export
    - name: 设置：导入配置…
      command: litegauge config import
    - name: 设置：「导入与导出」一行下的配置同步状态那句话
      missing: 实时同步状态由运行中的 App 持有，命令读不到；config sync on、config import 只回报它自己那一次同步的结果
    - name: 设置：升级到新版… / 下载新版…
      missing: 命令不做静默安装（做得到，只是不做）：update check 给出新版、按钮名、安装包地址与步骤，替换并重启 App 仍在设置窗口确认
  ui:
  - Sources/App.swift
  - Sources/DiagnosticsUI.swift
  - Sources/ResourceCareRuntime.swift
  source:
  - Sources/**
  - Tests/**
  - Info.plist
  - icon/AppIcon.icns
  - build.sh
  test_inputs:
  - Tests/**
  measure:
    # Resident menu-bar app without a main window: the script samples the running instance (shared batch_measure,
    # release zip size) and times 5 --benchmark test instances (first CPU reading). A test instance briefly adds a
    # second menu-bar item, so it runs only while the owner is away.
    command: ~/Dev/.venv/bin/python scripts/measure-sop.py
    outputs:
    - perf/lightweight.json
    - perf/raw
    in_use: false
  budget:
    cpu: 0.3
    memory_mb: 30
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/LiteGauge
    rationale: 56 点菜单栏，随时查看 CPU、内存与磁盘。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
