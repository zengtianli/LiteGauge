name: Core tests

on:
  push:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'build.sh'
      - 'Info.plist'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'build.sh'
      - 'Info.plist'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests on Apple Silicon
        run: bash build.sh --test-only
